# Optional: sync medagent-secrets from AWS Secrets Manager with the External
# Secrets Operator (https://external-secrets.io), instead of kubectl create.
# Not applied by kustomize. Store one JSON secret, e.g. "medagent/prod", with
# the keys from base/secret.example.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medagent-secrets
  namespace: medagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: medagent-secrets
  dataFrom:
    - extract:
        key: medagent/prod
