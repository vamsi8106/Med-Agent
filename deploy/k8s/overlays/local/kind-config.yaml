# kind create cluster --name medagent --config deploy/k8s/overlays/local/kind-config.yaml
# The app's NodePort (30080) is published on the host as localhost:18080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
