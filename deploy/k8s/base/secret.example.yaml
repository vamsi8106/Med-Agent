# NOT applied by kustomize and never committed with real values. Create the
# real Secret out of band, e.g.
#   kubectl -n medagent create secret generic medagent-secrets --from-env-file=secrets.env
# or sync it from AWS Secrets Manager with External Secrets
# (overlays/aws/external-secret.example.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: medagent-secrets
type: Opaque
stringData:
  POSTGRES_DSN: postgresql://medagent:<password>@<host>:5432/medagent?sslmode=require
  JWT_SECRET_KEY: <openssl rand -hex 32>
  ADMIN_BOOTSTRAP_USERNAME: admin
  ADMIN_BOOTSTRAP_PASSWORD: <12+ characters>
  # Only for the provider you use:
  LLM_API_KEY: ""
  GROQ_API_KEY: ""
