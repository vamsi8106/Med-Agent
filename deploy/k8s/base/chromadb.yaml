# Guideline embeddings only -- no patient data. One replica with a volume;
# ingest with the CLI (see docs/deployment.md, "Kubernetes and AWS").
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb
  labels: { app.kubernetes.io/name: chromadb }
spec:
  serviceName: chromadb
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: chromadb }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chromadb }
    spec:
      containers:
        - name: chromadb
          # Must track the chromadb Python client's major version (pyproject.toml).
          image: chromadb/chroma:1.5.9
          ports: [{ name: http, containerPort: 8000 }]
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  labels: { app.kubernetes.io/name: chromadb }
spec:
  selector: { app.kubernetes.io/name: chromadb }
  ports: [{ name: http, port: 8000, targetPort: http }]
