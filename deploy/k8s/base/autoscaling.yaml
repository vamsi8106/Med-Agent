# Several replicas are safe: drafts and abuse limits live in Postgres
# (STATE_BACKEND=postgres). Scale on CPU; an assessment is mostly waiting on
# the LLM and MCP servers, so keep the minimum at 2 for availability.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medagent
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medagent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: medagent
