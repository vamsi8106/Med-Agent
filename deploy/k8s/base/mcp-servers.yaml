# The three MCP servers: stateless, so each can run several replicas. They are
# third-party Node images (see docker/ and scripts/setup_vendor_mcp.sh); they
# reach the public FDA / PubMed / ClinicalTrials.gov APIs, so they need egress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-mcp-bridge
  labels: { app.kubernetes.io/name: medical-mcp-bridge }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: medical-mcp-bridge }
  template:
    metadata:
      labels: { app.kubernetes.io/name: medical-mcp-bridge }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" in node:20-alpine
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: medical-mcp-bridge
          image: medical-mcp-bridge
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi } # headless Chrome for some lookups
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: medical-mcp-bridge
  labels: { app.kubernetes.io/name: medical-mcp-bridge }
spec:
  selector: { app.kubernetes.io/name: medical-mcp-bridge }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-mcp
  labels: { app.kubernetes.io/name: healthcare-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: healthcare-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: healthcare-mcp }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: healthcare-mcp
          image: healthcare-mcp
          ports: [{ name: http, containerPort: 3000 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-mcp
  labels: { app.kubernetes.io/name: healthcare-mcp }
spec:
  selector: { app.kubernetes.io/name: healthcare-mcp }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-mcp
  labels: { app.kubernetes.io/name: research-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: research-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: research-mcp }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: research-mcp
          image: research-mcp
          ports: [{ name: http, containerPort: 3000 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /api/status, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/status, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: research-mcp
  labels: { app.kubernetes.io/name: research-mcp }
spec:
  selector: { app.kubernetes.io/name: research-mcp }
  ports: [{ name: http, port: 3000, targetPort: http }]
