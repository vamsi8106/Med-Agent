apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels: { app.kubernetes.io/name: vllm }
spec:
  replicas: 1
  # One GPU node: the old pod must go before the new one can start.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: vllm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vllm }
    spec:
      nodeSelector: { nvidia.com/gpu.present: "true" }
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.32.0
          args:
            - --model=$(MODEL_NAME)
            - --served-model-name=$(MODEL_NAME)
            - --port=8000
            # The Evidence agent is a ReAct agent: tool calling is required.
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - --max-model-len=16384
          env:
            - name: MODEL_NAME
              valueFrom: { configMapKeyRef: { name: medagent-config, key: LLM_MODEL } }
            - { name: HF_HOME, value: /cache/huggingface }
          ports: [{ name: http, containerPort: 8000 }]
          resources:
            requests: { cpu: "2", memory: 12Gi, nvidia.com/gpu: 1 }
            limits: { memory: 14Gi, nvidia.com/gpu: 1 }
          # Downloading and loading the weights takes minutes.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: cache
          emptyDir: { sizeLimit: 60Gi }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels: { app.kubernetes.io/name: vllm }
spec:
  selector: { app.kubernetes.io/name: vllm }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
# Only the app may call the model.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-accepts-only-medagent
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: vllm }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: medagent }
      ports: [{ protocol: TCP, port: 8000 }]
