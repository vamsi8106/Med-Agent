services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medagent}
      POSTGRES_DB: medagent
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  healthcare-mcp:
    # vendor/ is a gitignored, freshly-cloned third-party source tree (see
    # scripts/setup_vendor_mcp.sh) -- the Dockerfile itself lives in the
    # tracked docker/ dir instead, pointed at that dir as the build context.
    build:
      context: ./vendor/healthcare-mcp
      dockerfile: ../../docker/healthcare-mcp/Dockerfile
    # Host port lets a bare `make serve` on the host (not the medagent
    # container) reach this service too -- see .env.example's "bare local
    # dev" section.
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  research-mcp:
    build:
      context: ./vendor/med-research-mcp-suite
      dockerfile: ../../docker/med-research-mcp-suite/Dockerfile
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  medical-mcp-bridge:
    build: ./docker/medical-mcp-bridge
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  medagent:
    build: .
    command: sh -c "alembic upgrade head && uvicorn medagent.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: postgresql://medagent:${POSTGRES_PASSWORD:-medagent}@postgres:5432/medagent
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      MEDICAL_MCP_URL: http://medical-mcp-bridge:8080
      HEALTHCARE_MCP_URL: http://healthcare-mcp:3000
      RESEARCH_MCP_URL: http://research-mcp:3000
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-medagent}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-secret-change-me-in-prod-please}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-30}
      MCP_RATE_LIMIT_PER_SECOND: ${MCP_RATE_LIMIT_PER_SECOND:-5}
      MCP_RATE_LIMIT_CAPACITY: ${MCP_RATE_LIMIT_CAPACITY:-10}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-change-me-before-first-deploy}
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      healthcare-mcp:
        condition: service_healthy
      research-mcp:
        condition: service_healthy
      medical-mcp-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      medagent:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  chroma-data:
  prometheus-data:
  grafana-data:
