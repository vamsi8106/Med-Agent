[project]
name = "medagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vamsi8106", email = "vamsivamsi219@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "langsmith>=0.12.4",
    "mcp>=2.2.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pypdf>=6.18.1",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "torch>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
medagent = "medagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/medagent/api/routes/*.py" = ["B008"]
"src/medagent/auth/dependencies.py" = ["B008"]

[tool.uv.sources]
# sentence-transformers pulls in torch transitively; without this override uv
# resolves the default GPU-enabled wheel, which drags in ~2.5GB of NVIDIA
# CUDA libraries (cudnn, cublas, nccl, triton, ...) this CPU-only server
# never uses -- it just runs a small local embedding model
# (all-MiniLM-L6-v2) for RAG, no GPU anywhere in this deployment.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
python_version = "3.12"
files = ["src/medagent"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
# Third-party medical/ML/agent libs here (chromadb, sentence-transformers,
# groq, mcp, langgraph) ship no stubs -- ignore missing imports globally
# rather than maintaining a growing per-package allowlist.
ignore_missing_imports = true

[tool.importlinter]
root_package = "medagent"
# The layer rules from AGENTS.md ("Dependency Rules"), enforced. One contract per
# layer: it may import only what the table lists. `api` and `app` sit on top and
# may import anything; nothing below them may import them.

[[tool.importlinter.contracts]]
name = "core does not import upward or sideways"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["medagent.core"]
forbidden_modules = ["medagent.infra", "medagent.llm", "medagent.tools", "medagent.memory", "medagent.rag", "medagent.auth", "medagent.agents", "medagent.workflows", "medagent.api", "medagent.app"]

[[tool.importlinter.contracts]]
name = "infra does not import upward or sideways"
