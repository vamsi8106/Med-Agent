name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.7"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      # tests/conftest.py starts its own throwaway Postgres via the Docker
      # CLI (same fixture used locally) -- ubuntu-latest runners ship Docker
      # already, so no separate `services:` container is needed here.
      - name: Run format check, lint, and unit tests
        run: make ci-check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t medagent:ci .
